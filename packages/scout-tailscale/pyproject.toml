[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scout-tailscale"
version = "0.3.2"
description = "Direct, owner-approved guest access to Scout machines over a private network."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
# Ed25519 and certificate parsing. The upper bound is deliberate: widen it
# only after the signing vectors and pin tests pass on the new major.
dependencies = ["cryptography>=42,<51"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
]

[project.scripts]
scout-tailscale = "scout_tailscale.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
