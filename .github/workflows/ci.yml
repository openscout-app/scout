name: CI

on:
  # CI runs only at explicit checkpoints, not on every commit, PR, branch
  # push, or tag. Dispatch it manually when a coherent batch is ready for
  # validation so a series of small PRs costs one run instead of one each.
  #
  # Deliberately NOT on pull_request or push: a stacked series produced ~3
  # runs per PR, most cancelling each other before finishing.
  #
  # Local exact-head/base validation is the default review evidence. Hosted
  # execution is optional and must be explicitly requested; required repository
  # rules and blocking review feedback still apply to every merge.
  workflow_dispatch:
  # Release Candidate deliberately reuses these checks as one lane of its
  # explicitly initiated validation workflow. This is callable, not ambient.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck and unit tests (Bun ${{ matrix.bun }})
    strategy:
      fail-fast: false
      matrix:
        bun: ["1.4.4"]
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install zsh for shell integration tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zsh
          zsh --version

      - name: Set up Node for CLI launcher tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.x"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The former positive checkpoint is pinned to a historical native ABI.
      # A new Bun floor is not native qualification; keep both product gates shut.
      - name: Unqualified native backends refuse on Bun 1.4
        run: bun test scripts/bun14-native-refusal.test.ts

      - name: Sync exec fence
        run: bun run sync-exec:fence

      - name: Core-only source boundary
        run: bun run check:core

      - name: Public repository presentation
        run: bun run check:presentation

      - name: Typecheck
        # Share the package list with the root check command.
        run: bun run check:types

      - name: CLI launcher and package tests
        run: bun run test:cli

      # Keep runtime selection in its package script: nested units and scenarios,
      # excluding opt-in live tests. Both the root chain and fallback delegate.
      - name: Unit tests
        env:
          OPENSCOUT_CONFORMANCE: "1"
        run: |
          if bun -e "const pkg = require('./package.json'); process.exit(pkg.scripts?.['test:unit:source'] ? 0 : 1)"; then
            bun run test:unit:source
          else
            bun run --cwd packages/protocol test
            bun run --cwd packages/agent-sessions test
            bun run --cwd packages/runtime test
            bun run --cwd packages/pairing test
            bun test packages/session-trace/src/*.test.ts
          fi

  rust-scoutd:
    name: scoutd verification
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify scout-tui
        run: cargo check --manifest-path crates/scout-tui/Cargo.toml

      - name: Verify
        run: bash scripts/scoutd-verify.sh

  extension-channel-refusal:
    name: Dormant native refusal (${{ matrix.os }}, Bun ${{ matrix.bun }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
        bun: ["1.4.4"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.x"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      # This is refusal evidence, not positive transport qualification. Preserve
      # the exact-revision positive runner for a separate native backend review.
      - run: bun test scripts/bun14-native-refusal.test.ts packages/runtime/src/extension-channel-qualification.test.ts packages/runtime/src/supervision-handoff/native-load-fence.test.ts
