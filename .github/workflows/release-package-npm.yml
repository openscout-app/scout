name: Release Package npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Reviewed public tag: vX.Y.Z (latest) or vX.Y.Z-dev.N (dev), v0.2.91+"
        required: true
      npm_tag:
        description: "npm dist-tag"
        required: true
        default: "latest"
        type: choice
        options:
          - latest
          - dev
      recovery_run_id:
        description: "Prior failed run containing the exact candidate bundle (optional)"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  # npm publication is registry-global, so releases must serialize even when
  # different version tags are dispatched close together.
  group: release-package-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 45
    environment:
      name: Production
      # Dev needs the same signing secrets, but is not a stable deployment.
      deployment: ${{ inputs.npm_tag == 'latest' }}
    steps:
      - name: Resolve release target
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag || '' }}
          INPUT_NPM_TAG: ${{ inputs.npm_tag || '' }}
          INPUT_RECOVERY_RUN_ID: ${{ inputs.recovery_run_id || '' }}
        run: |
          set -euo pipefail

          tag="$INPUT_TAG"
          npm_tag="${INPUT_NPM_TAG:-latest}"
          recovery_run_id="$INPUT_RECOVERY_RUN_ID"

          case "$tag" in
            v*) version="${tag#v}" ;;
            *)
              echo "Release tag must start with v, got: $tag" >&2
              exit 1
              ;;
          esac

          case "$npm_tag" in
            latest) pattern='^[0-9]+\.[0-9]+\.[0-9]+$' ;;
            dev) pattern='^[0-9]+\.[0-9]+\.[0-9]+-dev\.(0|[1-9][0-9]*)$' ;;
            *) echo "npm_tag must be latest or dev, got: $npm_tag" >&2; exit 1 ;;
          esac
          if [[ ! "$version" =~ $pattern ]]; then
            echo "Release version does not match channel $npm_tag: $version" >&2
            exit 1
          fi
          minimum_version="0.2.91"
          IFS='.' read -r major minor patch <<< "${version%%-*}"
          major=$((10#$major))
          minor=$((10#$minor))
          patch=$((10#$patch))
          if ((major == 0 && (minor < 2 || (minor == 2 && patch < 91)))); then
            echo "This workflow publishes v${minimum_version} or later, got: v${version}" >&2
            exit 1
          fi
          if [[ -n "$recovery_run_id" && ! "$recovery_run_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "Recovery run id must be a positive integer, got: $recovery_run_id" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "npm_tag=${npm_tag:-latest}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Verify canonical public source
        id: source
        shell: bash
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "openscout-app/scout" ]] || {
            echo "Release workflow must run in openscout-app/scout, got: $GITHUB_REPOSITORY" >&2
            exit 1
          }
          [[ "$DISPATCH_REF" == "refs/heads/main" ]] || {
            echo "Release workflow must be dispatched from public main, got: $DISPATCH_REF" >&2
            exit 1
          }
          release_sha="$(git rev-parse HEAD^{commit})"
          [[ "$release_sha" == "$DISPATCH_SHA" ]] || {
            echo "Release tag resolves to $release_sha, but the main dispatch attests $DISPATCH_SHA" >&2
            exit 1
          }
          git fetch --no-tags origin refs/heads/main
          git merge-base --is-ancestor HEAD FETCH_HEAD || {
            echo "Release tag is not reachable from public main." >&2
            exit 1
          }
          git_common_dir="$(git rev-parse --path-format=absolute --git-common-dir)"
          bundle_path="${git_common_dir}/scout-release/npm/${RELEASE_VERSION}-${release_sha}"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "bundle_path=$bundle_path" >> "$GITHUB_OUTPUT"
          echo "candidate_artifact_name=scout-npm-candidate-bundle-${RELEASE_VERSION}-${release_sha}" >> "$GITHUB_OUTPUT"

      - name: Validate recovery run
        if: ${{ inputs.recovery_run_id != '' }}
        shell: bash
        env:
          EXPECTED_ARTIFACT: ${{ steps.source.outputs.candidate_artifact_name }}
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        run: |
          set -euo pipefail

          run_record="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_RUN_ID}" \
            --jq '[.path, .event, (.head_branch // ""), .head_sha, .status, (.conclusion // "")] | @tsv')"
          IFS=$'\t' read -r run_path run_event run_branch run_sha run_status run_conclusion <<< "$run_record"
          [[ "$run_path" == ".github/workflows/release-package-npm.yml" \
            && "$run_event" == "workflow_dispatch" \
            && "$run_branch" == "main" \
            && "$run_sha" == "$EXPECTED_SHA" \
            && "$run_status" == "completed" ]] || {
            echo "Recovery run does not match this workflow, main, and exact release SHA." >&2
            exit 1
          }
          case "$run_conclusion" in
            failure|cancelled|timed_out) ;;
            *)
              echo "Recovery run conclusion is not eligible: ${run_conclusion:-missing}" >&2
              exit 1
              ;;
          esac

          artifact_matches="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == \"${EXPECTED_ARTIFACT}\" and .expired == false) | .id")"
          if [[ -z "$artifact_matches" || "$artifact_matches" == *$'\n'* ]]; then
            echo "Recovery run must expose exactly one live ${EXPECTED_ARTIFACT} artifact." >&2
            exit 1
          fi
          echo "Validated recovery artifact ${artifact_matches} from run ${RECOVERY_RUN_ID}."

      - name: Restore exact release candidate bundle
        if: ${{ inputs.recovery_run_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.source.outputs.candidate_artifact_name }}
          path: ${{ steps.source.outputs.bundle_path }}
          github-token: ${{ github.token }}
          repository: openscout-app/scout
          run-id: ${{ inputs.recovery_run_id }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Import Developer ID certificate
        shell: bash
        env:
          P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_RELEASE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$P12_BASE64" || -z "$P12_PASSWORD" || -z "$KEYCHAIN_PASSWORD" ]]; then
            echo "::error::Missing macOS signing secrets."
            exit 1
          fi

          keychain="$RUNNER_TEMP/openscout-release.keychain-db"
          cert="$RUNNER_TEMP/developer-id-application.p12"

          printf '%s' "$P12_BASE64" | base64 -d > "$cert"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$cert" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"

      - name: Validate release manifest
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";

          const expected = process.env.RELEASE_VERSION;
          const tag = process.env.RELEASE_TAG;
          const manifests = [
            "package.json",
            "packages/agent-sessions/package.json",
            "packages/cli/package.json",
            "packages/protocol/package.json",
            "packages/runtime/package.json",
            "packages/session-trace/package.json",
            "packages/pairing/package.json",
          ];

          const drift = [];
          for (const manifest of manifests) {
            const pkg = JSON.parse(readFileSync(manifest, "utf8"));
            if (pkg.version !== expected) {
              drift.push(`${manifest}=${pkg.version}`);
            }
          }

          const lockfile = readFileSync("bun.lock", "utf8");
          for (const manifest of manifests.slice(1)) {
            const workspace = manifest.replace(/\/package\.json$/, "");
            const marker = `    "${workspace}": {`;
            const start = lockfile.indexOf(marker);
            const nextWorkspace = start < 0 ? -1 : lockfile.indexOf('\n    "', start + marker.length);
            const block = start < 0
              ? ""
              : lockfile.slice(start, nextWorkspace >= 0 ? nextWorkspace : lockfile.length);
            const lockVersion = block.match(/"version"\s*:\s*"([^"]+)"/)?.[1];
            if (lockVersion !== expected) {
              drift.push(`bun.lock:${workspace}=${lockVersion ?? "missing"}`);
            }
          }

          if (drift.length > 0) {
            throw new Error(`Manifest versions must match ${tag}: ${drift.join(", ")}`);
          }

          const productSource = readFileSync("packages/cli/src/lib/shared/product.ts", "utf8");
          const productMatch = /export const SCOUT_APP_VERSION = process\.env\.SCOUT_APP_VERSION\?\.trim\(\) \|\| "([^"]+)";/.exec(productSource);
          if (!productMatch || productMatch[1] !== expected) {
            throw new Error(
              `SCOUT_APP_VERSION must match ${tag}, got ${productMatch?.[1] ?? "unreadable"}`,
            );
          }

          const docs = JSON.parse(readFileSync("docs.json", "utf8"));
          if (docs.version !== expected) {
            throw new Error(`docs.json version must match ${tag}, got ${docs.version}`);
          }

          const server = JSON.parse(readFileSync("packages/cli/server.json", "utf8"));
          const serverPackage = server.packages?.find((entry) => entry.identifier === "@openscout/scout");
          if (server.version !== expected || serverPackage?.version !== expected) {
            throw new Error(
              `packages/cli/server.json versions must match ${tag}, got ${server.version} and ${serverPackage?.version}`,
            );
          }

          const cli = JSON.parse(readFileSync("packages/cli/package.json", "utf8"));
          if (cli.name !== "@openscout/scout") {
            throw new Error(`Unexpected public package name: ${cli.name}`);
          }

          const protocol = JSON.parse(readFileSync("packages/protocol/package.json", "utf8"));
          if (protocol.name !== "@openscout/protocol") {
            throw new Error(`Unexpected public package name: ${protocol.name}`);
          }
          JS

      - name: Prepare exact release candidates
        env:
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
          # Public releases carry GitHub Actions build provenance through npm.
          NPM_CONFIG_PROVENANCE: "true"
          OPENSCOUT_REQUIRE_SCOUTD_SIGN: "1"
          OPENSCOUT_SIGN_IDENTITY: ${{ vars.OPENSCOUT_SIGN_IDENTITY || '' }}
        run: bash scripts/ship-npm.sh --prepare

      - name: Upload exact release candidate bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.source.outputs.candidate_artifact_name }}
          path: ${{ steps.source.outputs.bundle_path }}
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 90

      - name: Publish public package set
        env:
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          bash scripts/ship-npm.sh --publish-prepared
          # Defense in depth: a durable candidate receipt is not publication
          # evidence. Re-read npm before any receipt can be uploaded.
          bash scripts/ship-npm.sh --verify-published

      - name: Locate exact release receipt
        id: receipt
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          receipt=".git/scout-release/npm/${RELEASE_VERSION}-${release_sha}/receipt.json"
          test -s "$receipt" || {
            echo "::error::Exact npm release receipt is missing: $receipt"
            exit 1
          }
          artifact="$RUNNER_TEMP/scout-npm-release-receipt-${RELEASE_VERSION}.json"
          cp "$receipt" "$artifact"
          echo "path=$artifact" >> "$GITHUB_OUTPUT"

      - name: Upload exact release receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scout-npm-release-receipt-${{ steps.release.outputs.version }}
          path: ${{ steps.receipt.outputs.path }}
          if-no-files-found: error
          retention-days: 90
